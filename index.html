<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tablet OS Dashboard</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="index.js" defer></script>
</head>
<body>
    <div class="panel">
        <!-- Top Navigation / Status Bar -->
        <header class="navbar">
            <div class="nav-section time-date">
                <span class="clock" id="clock">--:--:--</span>
                <span class="date" id="date"></span>
            </div>
            <div class="nav-section title-banner">
                <h1>DAILY OPS</h1>
            </div>
            <div class="nav-section weather-status">
                <span class="temp" id="temperature-detail">--°C</span>
                <span class="weather-icon">☁</span>
                <span class="battery">[ 96% ]</span>
            </div>
        </header>

        <!-- 4-Quadrant Main Dashboard -->
        <main class="dashboard">
            
            <!-- QUAD 1: TASKS (Google Tasks Sync) -->
            <section class="quadrant tasks-quad">
                <div class="quad-header">
                    <span>TASKS</span>
                    <div class="task-tabs">
                        <button class="tab-btn active" id="tab-today" onclick="setTaskView('today')">[ TODAY ]</button>
                        <button class="tab-btn" id="tab-upcoming" onclick="setTaskView('upcoming')">[ UPCOMING ]</button>
                        <button class="tab-btn" id="tab-completed" onclick="setTaskView('completed')">[ DONE ]</button>
                    </div>
                </div>
                <div class="quad-content">
                    <ul class="task-list" id="task-list">
                        <li>Loading tasks...</li>
                    </ul>
                </div>
            </section>

            <!-- QUAD 2: CALENDAR (Google Calendar Sync) -->
            <section class="quadrant calendar-quad">
                <div class="quad-header">
                    <span>CALENDAR</span>
                    <span class="sync-tag">[ G-CAL ]</span>
                </div>
                <div class="quad-content" id="calendar-events">
                    <div class="event-item">
                        <span class="event-title">Loading events...</span>
                    </div>
                </div>
            </section>

            <!-- QUAD 3: PRAYER TIMES (Islam) -->
            <section class="quadrant prayer-quad">
                <div class="quad-header">
                    <span>PRAYER TIMES</span>
                    <span class="sync-tag">[ ISLAM ]</span>
                </div>
                <div class="quad-content weather-layout">
                    <div class="weather-main">
                        <div class="big-temp" id="current-prayer">--</div>
                        <div class="condition" id="next-prayer-countdown">CALCULATING...</div>
                    </div>
                    <div class="weather-details">
                        <p id="fajr-detail">FAJR: --:--</p>
                        <p id="dhuhr-detail">DHUHR: --:--</p>
                        <p id="asr-detail">ASR: --:--</p>
                        <p id="maghrib-detail">MAGHRIB: --:--</p>
                        <p id="isha-detail">ISHA: --:--</p>
                    </div>
                </div>
            </section>

            <!-- QUAD 4: WEATHER -->
            <section class="quadrant weather-quad">
                <div class="quad-header">
                    <span>WEATHER</span>
                    <span class="sync-tag">[ LOCAL ]</span>
                </div>
                <div class="quad-content weather-layout">
                    <div class="weather-main">
                        <div class="big-temp" id="temperature-main">--°C</div>
                        <div class="condition" id="weather">--</div>
                    </div>
                    <div class="weather-details">
                        <p id="humidity">HUMIDITY: --%</p>
                        <p id="windSpeed">WIND: -- km/h</p>
                        <p id="cloud_cover">CLOUD: --%</p>
                        <p id="feels_like">FEELS: --°C</p>
                    </div>
                </div>
            </section>

        </main>
    </div>
</body>
</html>
